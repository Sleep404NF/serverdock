services:
  mariadb:
    image: mariadb:11.8
    container_name: serverdock-mariadb
    environment:
      MARIADB_DATABASE: serverdock
      MARIADB_USER: serverdock
      MARIADB_PASSWORD: serverdock
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - serverdock-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  serverdock-mariadb-data:
