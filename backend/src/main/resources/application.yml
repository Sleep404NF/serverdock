spring:
  application:
    name: serverdock-backend
  # 저장소 최상위의 .env 파일(git에 안 올라감)에서 디스코드 토큰 같은 비밀값을 읽는다. 없으면 건너뛴다.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3307/serverdock
    username: ${DB_USERNAME:serverdock}
    password: ${DB_PASSWORD:serverdock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # 개발할 때만 동작한다(developmentOnly 의존성). 백엔드를 켜면 DB 컨테이너를 먼저 띄우고 준비될 때까지 기다린다.
  # start-only: 백엔드를 꺼도 DB는 계속 켜 둔다. 재시작이 빨라진다.
  # 경로는 저장소 최상위 폴더 기준이다(IntelliJ 실행 설정과 bootRun 모두 그 폴더에서 실행).
  docker:
    compose:
      file: deploy/compose.dev.yaml
      lifecycle-management: start-only

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

serverdock:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
    expiry: 12h
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    image: ${MINECRAFT_IMAGE:itzg/minecraft-server:latest}
  trash:
    retention: ${TRASH_RETENTION:2d}
  # 디스코드. bot-token이 비어 있으면 봇을 켜지 않고, client-id/secret이 비어 있으면 계정 연결을 막는다.
  discord:
    bot-token: ${DISCORD_BOT_TOKEN:}
    client-id: ${DISCORD_CLIENT_ID:}
    client-secret: ${DISCORD_CLIENT_SECRET:}
    redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:5173/api/discord/callback}
    web-base-url: ${SERVERDOCK_WEB_URL:http://localhost:5173}
